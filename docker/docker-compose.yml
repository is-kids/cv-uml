services:
  cv-uml:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cv-uml
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../docs:/app/docs
      - ../eval_output:/app/eval_output
      - model-cache:/root/.cache/huggingface
    environment:
      - QWEN_MODEL=Qwen/Qwen2-VL-2B-Instruct
      - CUDA_VISIBLE_DEVICES=0
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - USE_4BIT=1
      - USE_OCR=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  model-cache:
    name: cv-uml-model-cache
